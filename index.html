<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1v1 Queue</title>
  <style>
    body { font-family: Arial, sans-serif; background:#121212; color:#fff; text-align:center; }
    h1 { margin-top: 20px; }
    input, button { padding:10px; margin:5px; font-size:16px; }
    #queue { margin-top:20px; }
    li { list-style:none; margin:5px 0; padding:5px; background:#222; border-radius:5px; }
  </style>
</head>
<body>

<h1>1v1 Queue</h1>

<input type="text" id="nameInput" placeholder="Enter your Ubisoft name">
<button onclick="addName()">Join Queue</button>

<ul id="queue"></ul>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAvozIfZ7lzhsyVrEhBY5XHB7TUVjftdYE",
  authDomain: "custom-queue.firebaseapp.com",
  databaseURL: "https://custom-queue-default-rtdb.firebaseio.com",
  projectId: "custom-queue",
  storageBucket: "custom-queue.firebasestorage.app",

  appId: "1:540277189278:web:e558e40a93d4853687698f",
  measurementId: "G-FE3CK7K6Y1"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

  // Add name to queue
  function addName() {
    const name = document.getElementById('nameInput').value.trim();
    if(name) {
      queueRef.push(name);
      document.getElementById('nameInput').value = '';
    }
  }

  // Display queue live
  const queueList = document.getElementById('queue');
  queueRef.on('value', snapshot => {
    queueList.innerHTML = '';
    snapshot.forEach(child => {
      const li = document.createElement('li');
      li.textContent = child.val();
      queueList.appendChild(li);
    });
  });
</script>

</body>
</html>
